<title>Cockpit des ventes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : une barre, un panneau d'en-tête (le chiffre et sa phrase), des tuiles, puis des blocs sur 12 colonnes.
   Couleurs : une teinte de marque (tomate) pour les séries simples, quatre teintes pour les répartitions.
   Les deux thèmes sont choisis, pas inversés : chaque palette a été vérifiée sur sa propre surface. */
:root {
  --plane: #ffffff;
  --surface: #ffffff;
  --surface-2: #f6f2ec;
  --panel: #faf5ee;
  --panel-glow-1: rgba(210, 71, 42, 0.13);
  --panel-glow-2: rgba(212, 154, 0, 0.13);
  --ink: #1f1a17;
  --ink-2: #5c534c;
  --ink-3: #877d74;
  --grid: #ece5db;
  --axis: #cfc5b8;
  --border: rgba(31, 26, 23, 0.10);
  --shadow: 0 1px 2px rgba(56, 38, 20, 0.05), 0 12px 32px -18px rgba(56, 38, 20, 0.22);
  --brand: #d2472a;
  --series-1: #d2472a;
  --series-2: #00939b;
  --series-3: #d49a00;
  --series-4: #6d5bd0;
  --soft-1: #f3cbbe;
  --seq-1: #f9d9cc; --seq-2: #f3b9a3; --seq-3: #ea9478; --seq-4: #de6d4c; --seq-5: #c64a2a; --seq-6: #9c3418;
  --seqt-1: #1f1a17; --seqt-2: #1f1a17; --seqt-3: #1f1a17; --seqt-4: #ffffff; --seqt-5: #ffffff; --seqt-6: #ffffff;
  --on-fill: #ffffff;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
  --delta-good: #0a7a2f; --delta-good-bg: rgba(10, 122, 47, 0.10);
  --delta-bad: #b3261e; --delta-bad-bg: rgba(179, 38, 30, 0.09);
  --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --plane: #141110; --surface: #211d1a; --surface-2: #2c2622; --panel: #1d1916;
    --panel-glow-1: rgba(224, 96, 63, 0.20); --panel-glow-2: rgba(189, 138, 10, 0.12);
    --ink: #f4eee6; --ink-2: #c9bfb4; --ink-3: #978c81; --grid: #332d28; --axis: #4d453e;
    --border: rgba(255, 255, 255, 0.10); --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 14px 32px -18px rgba(0, 0, 0, 0.7);
    --brand: #e0603f; --series-1: #e0603f; --series-2: #22a1a7; --series-3: #bd8a0a; --series-4: #857ce8; --soft-1: #6b3223;
    --seq-1: #45221a; --seq-2: #6a2e1f; --seq-3: #933c24; --seq-4: #bd4c2c; --seq-5: #e0603f; --seq-6: #f29a80;
    --seqt-1: #f4eee6; --seqt-2: #f4eee6; --seqt-3: #f4eee6; --seqt-4: #ffffff; --seqt-5: #1f1a17; --seqt-6: #1f1a17;
    --delta-good: #5fcf80; --delta-good-bg: rgba(95, 207, 128, 0.14); --delta-bad: #f58d79; --delta-bad-bg: rgba(245, 141, 121, 0.14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --plane: #141110; --surface: #211d1a; --surface-2: #2c2622; --panel: #1d1916;
  --panel-glow-1: rgba(224, 96, 63, 0.20); --panel-glow-2: rgba(189, 138, 10, 0.12);
  --ink: #f4eee6; --ink-2: #c9bfb4; --ink-3: #978c81; --grid: #332d28; --axis: #4d453e;
  --border: rgba(255, 255, 255, 0.10); --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 14px 32px -18px rgba(0, 0, 0, 0.7);
  --brand: #e0603f; --series-1: #e0603f; --series-2: #22a1a7; --series-3: #bd8a0a; --series-4: #857ce8; --soft-1: #6b3223;
  --seq-1: #45221a; --seq-2: #6a2e1f; --seq-3: #933c24; --seq-4: #bd4c2c; --seq-5: #e0603f; --seq-6: #f29a80;
  --seqt-1: #f4eee6; --seqt-2: #f4eee6; --seqt-3: #f4eee6; --seqt-4: #ffffff; --seqt-5: #1f1a17; --seqt-6: #1f1a17;
  --delta-good: #5fcf80; --delta-good-bg: rgba(95, 207, 128, 0.14); --delta-bad: #f58d79; --delta-bad-bg: rgba(245, 141, 121, 0.14);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--plane); color: var(--ink); font: 400 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.wrap { max-width: 1360px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* Barre du haut */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 18px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--brand); display: grid; place-items: center; box-shadow: 0 6px 16px -8px var(--brand); }
.brand-name { font: 600 20px/1.1 var(--font-display); letter-spacing: -0.01em; }
.brand-sub { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.tabs { display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--surface-2); overflow-x: auto; }
.tab { border: 0; background: none; padding: 7px 16px; border-radius: 999px; color: var(--ink-2); font-weight: 500; font-size: 14.5px; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--border), 0 2px 6px -3px rgba(56, 38, 20, 0.3); }
.top-meta { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 13px; color: var(--ink-2); }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.pill.demo .dot { background: var(--warning); }
.pill.ok .dot { background: var(--good); }
.pill.ko .dot { background: var(--critical); }
.icon-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); padding: 0; }
.icon-btn:hover { color: var(--ink); background: var(--surface-2); }
@media (max-width: 980px) { .tabs { order: 3; width: 100%; } .tab { flex: 1; text-align: center; } }

/* Panneau d'en-tête */
.hero {
  position: relative; border-radius: 28px; border: 1px solid var(--border);
  background: radial-gradient(900px 440px at 92% -18%, var(--panel-glow-1), transparent 62%), radial-gradient(760px 420px at -6% 122%, var(--panel-glow-2), transparent 60%), var(--panel);
  padding: 36px 40px 92px; display: grid; grid-template-columns: minmax(0, 390px) minmax(0, 1fr); gap: 20px 56px; align-items: stretch;
}
.hero-left { display: flex; flex-direction: column; min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.hero-value { font-weight: 600; font-size: clamp(46px, 5.2vw, 68px); line-height: 1.02; letter-spacing: -0.035em; margin-top: 12px; white-space: nowrap; }
.hero-delta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; font-size: 13.5px; color: var(--ink-2); min-height: 26px; }
.hero-headline { font: 500 25px/1.24 var(--font-display); letter-spacing: -0.012em; margin: 26px 0 0; text-wrap: balance; }
.hero-headline em { font-style: italic; color: var(--brand); }
.hero-range { margin-top: auto; padding-top: 22px; color: var(--ink-3); font-size: 13px; }
.hero-right { min-width: 0; display: flex; flex-direction: column; }
.hero-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-bottom: 14px; min-height: 36px; }
.hero-tools .ghost { background: var(--surface); padding: 6px 13px; }
.hero-tools > :first-child { margin-right: auto; }
.hero-table { max-height: 300px; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 8px 16px; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 999px; cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--plane); }
@media (max-width: 980px) {
  .hero { grid-template-columns: minmax(0, 1fr); padding: 26px 20px 80px; border-radius: 22px; }
  .hero-headline { font-size: 21px; margin-top: 18px; }
  .hero-range { padding-top: 14px; }
}

/* Classement de la carte, dans l'en-tête */
.quad { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; flex: 1; }
.quad-tile { border-radius: 16px; border: 1px solid var(--border); background: var(--surface); padding: 14px 16px 15px; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.quad-tile.star { border-color: var(--brand); box-shadow: 0 0 0 3px var(--panel-glow-1); }
.quad-head { display: flex; align-items: baseline; gap: 8px; }
.quad-head b { font: 600 17px/1.2 var(--font-display); }
.quad-head .glyph { color: var(--brand); font-size: 14px; }
.quad-head .count { margin-left: auto; font-weight: 600; font-size: 20px; letter-spacing: -0.02em; }
.quad-what { color: var(--ink-3); font-size: 12.5px; }
.quad-names { margin-top: 6px; font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
.quad-act { margin-top: auto; padding-top: 8px; color: var(--ink-2); font-size: 12.5px; }
@media (max-width: 560px) { .quad { grid-template-columns: minmax(0, 1fr); } }

/* Trajet de la donnée, dans l'en-tête */
.flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; flex: 1; }
.step { position: relative; border: 1px solid var(--border); border-radius: 16px; padding: 14px 14px 15px; background: var(--surface); min-width: 0; }
.step .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--plane); font-size: 11.5px; font-weight: 700; }
.step b { display: block; font: 600 16px/1.2 var(--font-display); margin-top: 10px; }
.step .where { font-family: var(--font-mono); font-size: 11px; color: var(--brand); letter-spacing: 0.04em; }
.step p { margin: 6px 0 0; font-size: 12.5px; line-height: 1.4; color: var(--ink-2); }
.step:not(:last-child)::after { content: ""; position: absolute; right: -13px; top: 25px; width: 13px; height: 1px; background: var(--axis); }
@media (max-width: 980px) { .flow { grid-template-columns: minmax(0, 1fr); } .step:not(:last-child)::after { right: auto; left: 25px; top: auto; bottom: -13px; width: 1px; height: 13px; } }

/* Grille */
main { padding-block: 0 40px; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; } .c5 { grid-column: span 5; } .c4 { grid-column: span 4; }
.r2 { grid-row: span 2; }
@media (max-width: 980px) { .c8, .c7, .c6, .c5, .c4 { grid-column: span 12; } .r2 { grid-row: auto; } }

/* Tuiles : elles chevauchent le bas du panneau */
.kpis { grid-column: span 12; display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 20px; margin: -60px 24px 0; position: relative; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); padding: 16px 20px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi-label { color: var(--ink-2); font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-mid { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 2px; }
.kpi-value { font-weight: 600; font-size: 30px; line-height: 1.15; letter-spacing: -0.025em; overflow-wrap: anywhere; }
.kpi-value.text { font: 600 24px/1.2 var(--font-display); letter-spacing: -0.01em; padding-block: 3px; }
.kpi-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 8px; }
.kpi-note { color: var(--ink-3); font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.good { color: var(--delta-good); background: var(--delta-good-bg); }
.chip.bad { color: var(--delta-bad); background: var(--delta-bad-bg); }
.chip.flat { color: var(--ink-2); background: var(--surface-2); }
.spark { flex: none; }
@media (max-width: 980px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: -56px 12px 0; } .kpi { padding: 14px 14px; } .kpi-label { white-space: normal; } .kpi-value { font-size: 24px; } .kpi-value.text { font-size: 19px; } .spark { display: none; } }

/* Blocs */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); padding: 22px 24px 20px; min-width: 0; display: flex; flex-direction: column; }
.card-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.card-head h2 { margin: 0; font: 600 20px/1.22 var(--font-display); letter-spacing: -0.012em; text-wrap: balance; }
.card-head p { margin: 5px 0 0; color: var(--ink-2); font-size: 13.5px; text-wrap: pretty; }
.card-head .txt { min-width: 0; flex: 1; }
.ghost { flex: none; border: 1px solid var(--border); background: none; border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.ghost:hover { background: var(--surface-2); color: var(--ink); }
.slot { width: 100%; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--ink-2); }
.card .legend { margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.key { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.key.line { height: 3px; width: 18px; border-radius: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chips button { border: 1px solid var(--border); background: none; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--plane); }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: var(--font-body); }
.t-axis { fill: var(--ink-3); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.t-label { fill: var(--ink); font-size: 12px; font-weight: 600; }
.t-quad { fill: var(--ink-3); font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--axis); stroke-width: 1; }
.empty { color: var(--ink-3); font-size: 14px; padding: 24px 0; }

/* Tableaux */
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; padding: 6px 12px 8px 0; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-right: 14px; }
td.muted { color: var(--ink-2); }
td.strong { font-weight: 600; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }

/* Barres classées */
.rank { display: grid; grid-template-columns: 22px minmax(110px, 0.9fr) minmax(60px, 1.5fr) auto auto; gap: 11px 12px; align-items: center; font-size: 13.5px; }
.rank .pos { color: var(--ink-3); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rank .name { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.rank .name small { display: block; color: var(--ink-3); font-size: 12px; font-weight: 400; }
.rank .track { height: 10px; }
.rank .bar { height: 10px; border-radius: 0 5px 5px 0; background: var(--series-1); min-width: 2px; }
.rank .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.rank .sub { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: 12.5px; }
@media (max-width: 560px) { .rank { grid-template-columns: 18px minmax(96px, 1fr) minmax(40px, 1fr) auto; } .rank .sub { display: none; } }

/* Barre segmentée */
.segbar { display: flex; gap: 2px; height: 28px; }
.segbar > div { border-radius: 4px; min-width: 2px; display: flex; align-items: center; padding-left: 9px; font-size: 12.5px; font-weight: 600; color: var(--on-fill); white-space: nowrap; }
.seglist { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px 12px; align-items: center; margin-top: 18px; font-size: 13.5px; }
.seglist .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.seglist .p { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-3); min-width: 48px; }

/* Affluence */
.heat { display: grid; gap: 3px; font-size: 11.5px; }
.heat .hl { color: var(--ink-3); display: flex; align-items: center; padding-right: 10px; font-size: 12.5px; }
.heat .hh { color: var(--ink-3); text-align: center; font-variant-numeric: tabular-nums; padding-top: 5px; }
.heat .cell { aspect-ratio: 1.5; border-radius: 5px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-weight: 700; min-width: 0; }
.heat.tight { gap: 2px; } .heat.tight .cell { aspect-ratio: 1; border-radius: 4px; }
.heat .cell:hover { outline: 2px solid var(--ink); outline-offset: -1px; }
.heat-scale { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; color: var(--ink-3); font-size: 12.5px; }
.heat-scale i { display: block; width: 22px; height: 10px; border-radius: 3px; }
.heat-scale .steps { display: flex; gap: 2px; }

/* Du brut au net */
.bridge { display: grid; gap: 0; font-size: 14px; }
.bridge > div { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 11px 0; border-bottom: 1px solid var(--grid); align-items: baseline; }
.bridge > div:last-child { border-bottom: 0; padding-bottom: 2px; }
.bridge small { display: block; color: var(--ink-3); font-size: 12.5px; }
.bridge .v { font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; }
.bridge .total { font-weight: 600; }
.bridge .total .v { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; }

/* Classement de la carte */
.klass { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border: 1px solid var(--border); border-radius: 999px; font-size: 12.5px; font-weight: 500; white-space: nowrap; background: var(--surface-2); }
.klass.star { background: var(--ink); color: var(--plane); border-color: var(--ink); }
.meter { display: flex; align-items: center; gap: 10px; }
.meter .track { flex: 1; min-width: 60px; height: 8px; border-radius: 4px; background: var(--seq-1); }
.meter .fill { height: 8px; border-radius: 4px; background: var(--series-1); }
.costs { display: grid; grid-template-columns: auto 1fr; gap: 12px 16px; align-items: center; font-size: 13.5px; }
.meter b { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

/* Fiabilité */
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.checks li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; font-size: 14px; }
.checks .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; background: var(--good); margin-top: 1px; }
.checks .ic.warn { background: var(--warning); color: #1f1a17; } .checks .ic.fail { background: var(--critical); }
.checks small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.checks .n { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 500; }

<script type="application/json" id="cockpit-data">/*__COCKPIT_DATA__*/</script>
<script>
(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("cockpit-data").textContent);
  const META = DATA.meta;
  const LOCALE = META.client.locale;
  const objects = (t) => t.rows.map((r) => Object.fromEntries(t.cols.map((c, i) => [c, r[i]])));
  const DAILY = objects(DATA.daily), CHANNELS = objects(DATA.channels), TENDERS = objects(DATA.tenders);
  const HOURLY = objects(DATA.hourly), PRODUCT_DAILY = objects(DATA.product_daily);
  const PRODUCTS = new Map(objects(DATA.products).map((p) => [p.product_id, p]));
  const MENU = objects(DATA.menu), PAIRS = objects(DATA.pairs), RUNS = objects(DATA.runs), Q = DATA.quality;

  /* ---------- formats ---------- */
  const nf = (o) => new Intl.NumberFormat(LOCALE, o);
  const money0 = nf({ style: "currency", currency: META.client.currency, maximumFractionDigits: 0 });
  const money2 = nf({ style: "currency", currency: META.client.currency, minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const int = nf({ maximumFractionDigits: 0 });
  const dec1 = nf({ minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const pct = (v, d = 1) => nf({ style: "percent", minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
  const toDate = (iso) => new Date(iso + "T00:00:00Z");
  const dfmt = (o) => new Intl.DateTimeFormat(LOCALE, { timeZone: "UTC", ...o });
  const dShort = (iso) => dfmt({ day: "numeric", month: "short" }).format(toDate(iso));
  const dLong = (iso) => dfmt({ weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(toDate(iso));
  const dFull = (iso) => dfmt({ day: "numeric", month: "long", year: "numeric" }).format(toDate(iso));
  const dMonth = (iso) => dfmt({ month: "short", year: "2-digit" }).format(toDate(iso));
  const stamp = (iso) => new Intl.DateTimeFormat(LOCALE, { dateStyle: "long", timeStyle: "short" }).format(new Date(iso));
  const addDays = (iso, n) => new Date(toDate(iso).getTime() + n * 864e5).toISOString().slice(0, 10);
  const WEEKDAYS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
  const WD_SHORT = ["lun.", "mar.", "mer.", "jeu.", "ven.", "sam.", "dim."];
  const sum = (rows, f) => rows.reduce((a, r) => a + (f(r) || 0), 0);
  const lower = (t) => t.charAt(0).toLocaleLowerCase(LOCALE) + t.slice(1);
  const upper = (t) => t.charAt(0).toLocaleUpperCase(LOCALE) + t.slice(1);

  /* ---------- DOM ---------- */
  const SVG_NS = "http://www.w3.org/2000/svg";
  function build(el, attrs, kids) {
    for (const k in attrs || {}) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat(3)) {
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const h = (tag, attrs, ...kids) => build(document.createElement(tag), attrs, kids);
  const s = (tag, attrs, ...kids) => build(document.createElementNS(SVG_NS, tag), attrs, kids);
  const cssVar = (name) => `var(--${name})`;

  /* Un graphique se dessine à la largeur réelle de son emplacement : on pose l'emplacement, puis on dessine. */
  const pending = [];
  function slot(draw) { const el = h("div", { class: "slot" }); pending.push([el, draw]); return el; }
  function flush() { for (const [el, draw] of pending.splice(0)) { const node = draw(el.clientWidth || 600); if (node) el.append(node); } }

  /* ---------- infobulle ---------- */
  const tipEl = document.getElementById("tip");
  const tip = {
    show(evt, title, rows, note) {
      tipEl.replaceChildren(
        h("h4", { text: title }),
        ...rows.map((r) => h("div", { class: "row" }, r.color && h("i", { style: `background:${r.color}` }), h("b", { text: r.value }), h("span", { text: r.label }))),
        note && h("p", { text: note })
      );
      tipEl.hidden = false;
      const w = tipEl.offsetWidth, hh = tipEl.offsetHeight;
      let x = evt.clientX + 14, y = evt.clientY + 14;
      if (x + w > innerWidth - 8) x = evt.clientX - w - 14;
      if (y + hh > innerHeight - 8) y = evt.clientY - hh - 14;
      tipEl.style.left = Math.max(8, x) + "px";
      tipEl.style.top = Math.max(8, y) + "px";
    },
    hide() { tipEl.hidden = true; },
  };
  const hover = (el, fn) => {
    el.addEventListener("pointermove", (e) => fn(e));
    el.addEventListener("pointerleave", tip.hide);
    return el;
  };

  /* ---------- état ---------- */
  const PERIODS = [{ days: 30, label: "30 jours" }, { days: 90, label: "90 jours" }, { days: 365, label: "12 mois" }];
  const TABS = [{ id: "ventes", label: "Ventes" }, { id: "carte", label: "Carte" }, { id: "fiabilite", label: "Fiabilité des données" }];
  const state = { tab: "ventes", days: 90, tables: new Set(), category: null };
  const fromHash = () => { const id = location.hash.slice(1); if (TABS.some((t) => t.id === id)) state.tab = id; };

  function windowOf(days) {
    const end = META.last_day;
    const start = addDays(end, -(days - 1)) < META.first_day ? META.first_day : addDays(end, -(days - 1));
    /* Un restaurant se compare à la même saison : 52 semaines plus tôt, pour retomber sur les mêmes jours de la semaine. */
    const shift = days >= 365 ? 365 : 364;
    if (addDays(start, -shift) >= META.first_day) {
      return { start, end, prev: { start: addDays(start, -shift), end: addDays(end, -shift), shift, label: "vs la même période, un an plus tôt" } };
    }
    const prevEnd = addDays(start, -1), prevStart = addDays(start, -days);
    return { start, end, prev: prevStart >= META.first_day ? { start: prevStart, end: prevEnd, shift: 0, label: `vs les ${days} jours précédents` } : null };
  }
  const within = (rows, key, w) => rows.filter((r) => r[key] >= w.start && r[key] <= w.end);
  const periodLabel = () => (PERIODS.find((p) => p.days === state.days) || {}).label || `${state.days} jours`;

  /* Regroupe les jours : par jour (30 j), par semaine (90 j), par mois (12 mois). */
  function buckets(days, period) {
    const out = new Map();
    for (const d of days) {
      let key, label;
      if (period <= 31) { key = d.date_day; label = dShort(d.date_day); }
      else if (period <= 100) { key = addDays(d.date_day, -(d.iso_weekday - 1)); label = "sem. du " + dShort(key); }
      else { key = d.date_day.slice(0, 7); label = dMonth(key + "-01"); }
      if (!out.has(key)) out.set(key, { key, label, days: [] });
      out.get(key).days.push(d);
    }
    return [...out.values()];
  }
  function bucketKey(iso, period) {
    if (period <= 31) return iso;
    if (period <= 100) { const wd = (toDate(iso).getUTCDay() + 6) % 7; return addDays(iso, -wd); }
    return iso.slice(0, 7);
  }

  function niceTicks(max, target = 4) {
    if (!(max > 0)) return [0, 1];
    const raw = max / target, pow = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * pow).find((v) => v >= raw);
    const ticks = [];
    for (let v = 0; v < max + step * 0.999; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
    return ticks;
  }

  /* ---------- briques ---------- */
  function card(id, cls, title, subtitle, draw, table) {
    const showTable = state.tables.has(id);
    const body = showTable && table ? tableNode(table) : typeof draw === "function" ? slot(draw) : draw;
    return h("section", { class: `card ${cls}` },
      h("div", { class: "card-head" },
        h("div", { class: "txt" }, h("h2", { text: title }), subtitle && h("p", { text: subtitle })),
        table && h("button", { class: "ghost", type: "button", "aria-pressed": String(showTable), text: showTable ? "Graphique" : "Tableau",
          onclick: () => { showTable ? state.tables.delete(id) : state.tables.add(id); render(); } })
      ),
      body
    );
  }
  function tableNode({ cols, rows }) {
    return h("div", { class: "table-scroll" }, h("table", null,
      h("thead", null, h("tr", null, cols.map((c) => h("th", { class: c.num ? "num" : null, text: c.label })))),
      h("tbody", null, rows.map((r) => h("tr", null, r.map((v, i) => h("td", { class: cols[i].num ? "num" : cols[i].cls || null }, v)))))
    ));
  }
  /* Écart avec la période précédente : flèche + valeur. La couleur dit si c'est une bonne nouvelle, jamais seule. */
  function deltaChip(cur, prev, { upIsGood = true, points = false } = {}) {
    if (prev == null || (!points && !prev)) return null;
    const diff = points ? (cur - prev) * 100 : (cur - prev) / prev;
    const flat = Math.abs(diff) < (points ? 0.05 : 0.0005);
    const up = diff > 0;
    const cls = flat ? "flat" : up === upIsGood ? "good" : "bad";
    const txt = (flat ? "= " : up ? "▲ +" : "▼ −") + (points ? dec1.format(Math.abs(diff)) + " pt" : pct(Math.abs(diff)));
    return h("span", { class: `chip ${cls}`, text: txt });
  }
  function sparkline(values) {
    const w = 92, hgt = 32, max = Math.max(...values), min = Math.min(...values);
    if (values.length < 3 || max === min) return null;
    const x = (i) => 4 + (i * (w - 8)) / (values.length - 1), y = (v) => hgt - 4 - ((v - min) / (max - min)) * (hgt - 8);
    const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    return s("svg", { class: "spark", width: w, height: hgt, viewBox: `0 0 ${w} ${hgt}`, "aria-hidden": "true" },
      s("polyline", { points: pts, fill: "none", stroke: cssVar("axis"), "stroke-width": 1.75, "stroke-linejoin": "round", "stroke-linecap": "round" }),
      s("circle", { cx: x(values.length - 1), cy: y(values[values.length - 1]), r: 3.5, fill: cssVar("series-1"), stroke: cssVar("surface"), "stroke-width": 2 }));
  }
  function kpi({ label, value, delta, note, spark, text }) {
    return h("div", { class: "kpi" },
      h("div", { class: "kpi-label", text: label }),
      h("div", { class: "kpi-mid" }, h("div", { class: "kpi-value" + (text ? " text" : ""), text: value }), spark),
      h("div", { class: "kpi-foot" }, delta, note && h("span", { class: "kpi-note", text: note })));
  }
  const kpiRow = (tiles) => h("div", { class: "kpis", style: `--n:${tiles.length}` }, tiles);
  function segmented(parts, valueFmt) {
    const total = sum(parts, (p) => p.value) || 1;
    const bar = h("div", { class: "segbar", role: "img", "aria-label": parts.map((p) => `${p.name} ${pct(p.value / total, 0)}`).join(", ") },
      parts.filter((p) => p.value > 0).map((p) => {
        const share = p.value / total;
        return hover(h("div", { style: `flex:${p.value} 1 0;background:${p.color};${p.dark ? "color:#1f1a17" : ""}`, text: share >= 0.09 ? pct(share, 0) : "" }),
          (e) => tip.show(e, p.name, [{ value: valueFmt(p.value), label: pct(share) + " du total", color: p.color }]));
      }));
    const list = h("div", { class: "seglist" }, parts.map((p) => [h("span", { class: "key", style: `background:${p.color}` }), h("span", { text: p.name }),
      h("span", { class: "v", text: valueFmt(p.value) }), h("span", { class: "p", text: pct(p.value / total) })]));
    return h("div", null, bar, list);
  }
  const SERIES = ["series-1", "series-2", "series-3", "series-4"];
  /* La couleur suit l'entité : l'ordre est fixé sur tout l'historique, pas sur la période affichée. */
  function entityOrder(rows, key, valueKey) {
    const totals = new Map();
    for (const r of rows) totals.set(r[key], (totals.get(r[key]) || 0) + r[valueKey]);
    return [...totals.entries()].sort((a, b) => b[1] - a[1]).map((e) => e[0]);
  }
  const CHANNEL_ORDER = entityOrder(CHANNELS, "order_type", "net_sales");
  const TENDER_ORDER = entityOrder(TENDERS, "tender_type", "total_collected");
  const CATEGORY_ORDER = entityOrder(PRODUCT_DAILY.map((r) => ({ c: PRODUCTS.get(r.product_id).category, v: r.net_sales })), "c", "v");
  function foldParts(order, valueOf) {
    const parts = order.slice(0, 4).map((name, i) => ({ name, value: valueOf(name), color: cssVar(SERIES[i]), dark: i === 2 }));
    const rest = sum(order.slice(4), valueOf);
    if (rest > 0) parts.push({ name: "Autres", value: rest, color: cssVar("axis"), dark: true });
    return parts;
  }
  /* Catégorie mise en avant dans l'onglet Carte : celle de la configuration, sinon celle qui vend le plus. */
  const MENU_CATEGORIES = CATEGORY_ORDER.filter((c) => MENU.filter((d) => d.category === c).length >= 2);
  const FOCUS = MENU_CATEGORIES.includes(META.client.focus_category) ? META.client.focus_category : MENU_CATEGORIES[0] || CATEGORY_ORDER[0] || "";
  /* « Pizza pepperoni » → « pepperoni » quand tous les produits d'une catégorie commencent par le même mot. */
  function shortNames(items) {
    const first = items.map((d) => d.product_name.split(" ")[0]);
    const common = items.length > 1 && first.every((w) => w === first[0]) && items.every((d) => d.product_name.includes(" ")) ? first[0] + " " : "";
    return (name) => (common && name.startsWith(common) ? name.slice(common.length) : name);
  }

  /* ---------- graphique : ventes par jour (en-tête) ---------- */
  function trendChart(days, width, lastYear) {
    const W = Math.max(300, width), H = W < 560 ? 230 : 300, m = { l: 54, r: 6, t: 24, b: 26 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const max = Math.max(...days.map((d) => d.net_sales), ...(lastYear || []).map((v) => v || 0), 1);
    const ticks = niceTicks(max), top = ticks[ticks.length - 1];
    const band = iw / days.length, x = (i) => m.l + i * band + band / 2, y = (v) => m.t + ih - (v / top) * ih;
    const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Ventes nettes par jour et moyenne mobile sur 7 jours" + (lastYear ? ", comparée à la même période un an plus tôt" : "") });
    svg.append(s("defs", null, s("linearGradient", { id: "trend-wash", x1: 0, y1: 0, x2: 0, y2: 1 },
      s("stop", { offset: "0%", "stop-color": cssVar("series-1"), "stop-opacity": 0.2 }), s("stop", { offset: "100%", "stop-color": cssVar("series-1"), "stop-opacity": 0 }))));
    for (const t of ticks) {
      svg.append(s("line", { class: t === 0 ? "baseline" : "gridline", x1: m.l, x2: W - m.r, y1: y(t), y2: y(t) }),
        s("text", { class: "t-axis", x: m.l - 10, y: y(t) + 4, "text-anchor": "end", text: int.format(t) + " $" }));
    }
    const bw = Math.max(1, Math.min(22, band - (band > 5 ? 2 : 0.6)));
    days.forEach((d, i) => {
      if (d.net_sales <= 0) return;
      const yy = y(d.net_sales), r = Math.min(4, bw / 2);
      svg.append(s("path", { fill: cssVar("soft-1"), d: `M${x(i) - bw / 2},${y(0)}V${yy + r}q0,${-r} ${r},${-r}h${bw - 2 * r}q${r},0 ${r},${r}V${y(0)}z` }));
    });
    if (lastYear) {
      const pts = lastYear.map((v, i) => (v == null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`)).filter(Boolean);
      if (pts.length > 1) svg.append(s("polyline", { fill: "none", stroke: cssVar("axis"), "stroke-width": 1.75, "stroke-linejoin": "round", "stroke-linecap": "round", points: pts.join(" ") }));
    }
    const avg = days.map((d, i) => (d.net_sales_7d_avg == null ? null : [x(i), y(d.net_sales_7d_avg)])).filter(Boolean);
    if (avg.length > 1) {
      const line = avg.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
      svg.append(s("path", { fill: "url(#trend-wash)", d: `M${avg[0][0].toFixed(1)},${y(0)}L${line.replace(/ /g, "L")}L${avg[avg.length - 1][0].toFixed(1)},${y(0)}z` }));
      svg.append(s("polyline", { fill: "none", stroke: cssVar("series-1"), "stroke-width": 2.25, "stroke-linejoin": "round", "stroke-linecap": "round", points: line }));
      const end = avg[avg.length - 1];
      svg.append(s("circle", { cx: end[0], cy: end[1], r: 4.5, fill: cssVar("series-1"), stroke: cssVar("panel"), "stroke-width": 2 }));
    }
    /* graduations de l'axe des dates */
    const base = days.length <= 31 ? 5 : days.length <= 100 ? 14 : 0;
    const every = base * Math.max(1, Math.ceil(56 / (base * band)));
    const monthStep = Math.max(1, Math.ceil(56 / (30.4 * band)));
    days.forEach((d, i) => {
      const isTick = every ? (days.length - 1 - i) % every === 0 : d.date_day.endsWith("-01") && (Number(d.date_day.slice(5, 7)) - 1) % monthStep === 0;
      if (!isTick) return;
      const anchor = x(i) > W - m.r - 24 ? "end" : "middle";
      svg.append(s("text", { class: "t-axis", x: x(i), y: H - 6, "text-anchor": anchor, text: every ? dShort(d.date_day) : dMonth(d.date_day) }));
    });
    /* étiquette directe : le meilleur jour */
    const best = days.reduce((a, d, i) => (d.net_sales > a.v ? { v: d.net_sales, i } : a), { v: -1, i: 0 });
    const bx = x(best.i), anchor = bx > W - 170 ? "end" : bx < m.l + 80 ? "start" : "middle";
    svg.append(s("text", { class: "t-label", x: bx, y: y(best.v) - 8, "text-anchor": anchor, text: `Record : ${dShort(days[best.i].date_day)} · ${money0.format(best.v)}` }));
    /* survol : le réticule trouve le jour */
    const cross = s("line", { class: "baseline", y1: m.t, y2: y(0), visibility: "hidden" });
    const dot = s("circle", { r: 4.5, fill: cssVar("series-1"), stroke: cssVar("panel"), "stroke-width": 2, visibility: "hidden" });
    const hit = s("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "transparent" });
    hit.addEventListener("pointermove", (e) => {
      const box = svg.getBoundingClientRect(), px = ((e.clientX - box.left) / box.width) * W;
      const i = Math.max(0, Math.min(days.length - 1, Math.floor((px - m.l) / band))), d = days[i];
      cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
      const hasAvg = d.net_sales_7d_avg != null;
      dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(d.net_sales_7d_avg || 0)); dot.setAttribute("visibility", hasAvg ? "visible" : "hidden");
      tip.show(e, dLong(d.date_day), d.orders
        ? [{ value: money0.format(d.net_sales), label: "ventes nettes", color: cssVar("soft-1") },
           ...(hasAvg ? [{ value: money0.format(d.net_sales_7d_avg), label: "moyenne 7 jours", color: cssVar("series-1") }] : []),
           ...(lastYear && lastYear[i] != null ? [{ value: money0.format(lastYear[i]), label: "moyenne 7 jours, un an plus tôt", color: cssVar("axis") }] : []),
           { value: int.format(d.orders), label: "commandes" }]
        : [{ value: "Fermé", label: "aucune commande" }]);
    });

  }
  const KLASS_ICON = { "Vedette": "★", "Valeur sûre": "●", "Énigme": "◆", "Poids mort": "▽" };
  const KLASS_TEXT = { "Vedette": "populaire et rentable", "Valeur sûre": "populaire, marge sous la moyenne", "Énigme": "rentable, mais peu commandé", "Poids mort": "peu commandé et peu rentable" };

  function viewCarte() {
    const w = windowOf(state.days), rows = within(PRODUCT_DAILY, "order_date", w);
    const by = new Map();
    for (const r of rows) {
      const o = by.get(r.product_id) || { id: r.product_id, qty: 0, net: 0, cost: 0, extras: 0, extrasAmount: 0 };
      o.qty += r.quantity; o.net += r.net_sales; o.cost += r.estimated_cost || 0; o.extras += r.lines_with_extras; o.extrasAmount += r.extras_amount || 0; by.set(r.product_id, o);
    }
    const list = [...by.values()].map((o) => ({ ...o, ...PRODUCTS.get(o.id) })).sort((p, q) => q.net - p.net);
    const net = sum(list, (o) => o.net), qty = sum(list, (o) => o.qty), cost = sum(list, (o) => o.cost);
    const focusItems = list.filter((o) => o.category === FOCUS), focusQty = sum(focusItems, (o) => o.qty);
    const newest = [...PRODUCTS.values()].filter((p) => p.first_sold_date > META.first_day).sort((p, q) => (q.first_sold_date > p.first_sold_date ? 1 : -1))[0];
    const newestRank = newest ? list.findIndex((o) => o.id === newest.product_id) + 1 : 0;
    const best = list[0];
    const withCost = list.filter((o) => o.cost > 0), costed = { qty: sum(withCost, (o) => o.qty), net: sum(withCost, (o) => o.net), cost: sum(withCost, (o) => o.cost) };
    const windowDays = META.menu_window_days || 90;

    /* en-tête : le classement de la catégorie phare, quadrant par quadrant */
    const focusMenu = MENU.filter((d) => d.category === FOCUS), focusShort = shortNames(focusMenu);
    const quad = h("div", { class: "quad" }, ["Énigme", "Vedette", "Poids mort", "Valeur sûre"].map((k) => {
      const items = focusMenu.filter((d) => d.menu_class === k);
      return h("div", { class: "quad-tile" + (k === "Vedette" ? " star" : "") },
        h("div", { class: "quad-head" }, h("span", { class: "glyph", "aria-hidden": "true", text: KLASS_ICON[k] }), h("b", { text: k }), h("span", { class: "count", text: int.format(items.length) })),
        h("div", { class: "quad-what", text: KLASS_TEXT[k] }),
        h("div", { class: "quad-names", text: items.length ? items.map((d) => focusShort(d.product_name)).join(" · ") : "—" }),
        items.length ? h("div", { class: "quad-act", text: items[0].recommended_action }) : null);
    }));
    const hero = [
      heroLeft({ eyebrow: "Coût matière estimé", value: net > 0 ? pct(cost / net) : "—", deltaNote: "des ventes nettes, selon le catalogue des coûts",
        headline: best ? [best.product_name, " arrive en tête\u00a0: ", money0.format(best.net), ", soit\u00a0", h("em", { text: pct(best.net / Math.max(1, net), 0) }), " des ventes."] : null,
        range: rangeText(w) }),
      h("div", { class: "hero-right" },
        h("div", { class: "hero-tools" }, h("div", { class: "eyebrow", text: focusMenu.length ? `${FOCUS} · classement sur ${windowDays} jours` : "Classement de la carte" }), periodSwitch()),
        focusMenu.length ? quad : h("div", { class: "empty", text: "Aucun coût renseigné dans le catalogue : le classement n'est pas calculable." }))];

    const kpis = kpiRow([
      kpi({ label: "Articles vendus", value: int.format(qty), note: `${list.length} produits à la carte` }),
      kpi({ label: `${FOCUS} avec un extra`, value: pct(sum(focusItems, (o) => o.extras) / Math.max(1, focusQty)), note: `${money0.format(sum(list, (o) => o.extrasAmount))} d'extras sur la période` }),
      kpi({ label: "Marge moyenne par article", value: costed.qty ? money2.format((costed.net - costed.cost) / costed.qty) : "—", note: "vente nette − coût matière estimé" }),
      kpi({ text: true, label: "Dernière nouveauté", value: newest ? upper(shortNames(list.filter((o) => o.category === newest.category))(newest.product_name)) : "—",
        note: newest ? `depuis le ${dFull(newest.first_sold_date)}` + (newestRank ? ` · ${newestRank}ᵉ vente de la période` : "") : "aucun lancement sur l'historique" })]);

    const top = list.slice(0, 10), topMax = top.length ? top[0].net : 1;
    const rank = h("div", { class: "rank" }, top.map((o, i) => [
      h("div", { class: "pos", text: String(i + 1) }),
      h("div", { class: "name" }, o.product_name, h("small", { text: o.category })),
      hover(h("div", { class: "track" }, h("div", { class: "bar", style: `width:${(o.net / topMax) * 100}%` })), (e) => tip.show(e, o.product_name, [
        { value: money0.format(o.net), label: "ventes nettes" }, { value: int.format(o.qty), label: "unités" }, { value: pct(o.net / Math.max(1, net)), label: "des ventes" }])),
      h("div", { class: "val", text: money0.format(o.net) }), h("div", { class: "sub", text: int.format(o.qty) + " u." })]));
    const catParts = foldParts(CATEGORY_ORDER, (c) => sum(list.filter((o) => o.category === c), (o) => o.net));
    const catCost = CATEGORY_ORDER.map((c) => { const items = list.filter((o) => o.category === c && o.cost > 0); return { name: c, net: sum(items, (o) => o.net), cost: sum(items, (o) => o.cost) }; }).filter((c) => c.net > 0);
    const costMax = Math.max(...catCost.map((c) => c.cost / c.net), 0.5);
    const catNode = h("div", null, segmented(catParts, (v) => money0.format(v)),
      catCost.length ? h("div", { class: "sub-h", text: "Coût matière estimé, en part des ventes" }) : null,
      h("div", { class: "costs" }, catCost.map((c) => [h("span", { text: c.name }),
        hover(h("div", { class: "meter" }, h("div", { class: "track" }, h("div", { class: "fill", style: `width:${(c.cost / c.net / costMax) * 100}%` })), h("b", { text: pct(c.cost / c.net) })),
          (e) => tip.show(e, c.name, [{ value: money0.format(c.cost), label: "de coût matière estimé" }, { value: money0.format(c.net), label: "de ventes nettes" }]))])));

    /* matrice : une catégorie à la fois, au choix */
    const cat = MENU_CATEGORIES.includes(state.category) ? state.category : FOCUS;
    const matrixItems = MENU.filter((d) => d.category === cat);
    const catChips = MENU_CATEGORIES.length > 1 && h("div", { class: "chips", role: "group", "aria-label": "Catégorie" }, MENU_CATEGORIES.map((c) =>
      h("button", { type: "button", "aria-pressed": String(c === cat), text: c, onclick: () => { state.category = c; render(); } })));
    const matrix = matrixItems.length
      ? (width) => h("div", null, catChips, scatter(matrixItems, width, shortNames(matrixItems)))
      : h("div", { class: "empty", text: "Aucun coût renseigné dans le catalogue pour cette catégorie." });

    const menuTable = { cols: [{ label: "Produit", cls: "strong" }, { label: "Catégorie", cls: "muted" }, { label: "Vendus", num: true }, { label: "Part", num: true }, { label: "Marge unitaire", num: true }, { label: "Classement" }, { label: "Piste d'action", cls: "muted" }],
      rows: MENU.map((d) => [d.product_name, d.category, int.format(d.quantity_sold), pct(d.mix_share), money2.format(d.unit_margin),
        h("span", { class: "klass" + (d.menu_class === "Vedette" ? " star" : "") }, h("span", { "aria-hidden": "true", text: KLASS_ICON[d.menu_class] || "" }), d.menu_class), d.recommended_action]) };

    const pairs = PAIRS.filter((p) => p.lift > 1.1).slice(0, 7), liftMax = Math.max(...pairs.map((p) => p.lift), 1);
    const pairsNode = pairs.length ? tableNode({ cols: [{ label: "Paire" }, { label: "Commandes", num: true }, { label: "Fréquence par rapport au hasard" }],
      rows: pairs.map((p) => [`${p.product_a_name} + ${p.product_b_name}`, int.format(p.orders_together),
        h("div", { class: "meter" }, h("div", { class: "track" }, h("div", { class: "fill", style: `width:${(p.lift / liftMax) * 100}%` })), h("b", { text: "× " + dec1.format(p.lift) }))]) })
      : h("div", { class: "empty", text: "Pas encore assez de commandes pour faire ressortir des associations." });

    return { hero, view: [kpis,
      card("matrix", "c7", `${cat}\u00a0: que pousser, que revoir`, `Chaque produit selon sa popularité et sa marge, sur les ${windowDays} derniers jours. Les deux lignes sont les seuils de la méthode Kasavana-Smith.`, matrix),
      card("pairs", "c5", "Souvent commandés ensemble", `Associations plus fréquentes que le hasard sur les ${windowDays} derniers jours : des idées de suggestions et de formules.`, pairsNode),
      card("top", "c7", "Les 10 produits qui rapportent le plus", "Ventes nettes sur la période, rabais et remboursements déduits.", rank,
        { cols: [{ label: "Produit" }, { label: "Catégorie", cls: "muted" }, { label: "Unités", num: true }, { label: "Ventes nettes", num: true }, { label: "Part", num: true }],
          rows: list.map((o) => [o.product_name, o.category, int.format(o.qty), money0.format(o.net), pct(o.net / Math.max(1, net))]) }),
      card("cats", "c5", "Ce que pèse chaque catégorie", "Part dans les ventes nettes de la période, puis ce que coûte la matière.", catNode),
      card("menu", "c12", "Classement complet de la carte", "Chaque produit est comparé aux autres produits de sa catégorie.", tableNode(menuTable))] };
  }

  /* ---------- onglet Fiabilité ---------- */
  function viewFiabilite() {
    const last = RUNS[0], L = Q ? Q.layers : null;
    const t = Q ? Q.totals : null, total = t ? t.pass + t.warn + t.fail : 0;
    const steps = [
      ["Caisse", "API CLOVER", "Chaque nuit, les commandes modifiées depuis le dernier passage sont relues."],
      ["Brut", "RAW", `Le JSON de la caisse est conservé tel quel${Q ? `, dans ${Q.sources} tables` : ""}.`],
      ["Préparation", "STAGING", `${L ? L.staging + L.intermediate : "Des"} vues : heure du restaurant, extras, rabais et remboursements.`],
      ["Analyse", "ANALYTICS", `${L ? L.marts : "Des"} tables documentées, prêtes à interroger.`],
      ["Cockpit", "HTML", "Cette page, régénérée après chaque exécution. La consulter ne coûte rien."]];
    const hero = [
      heroLeft({ eyebrow: "Contrôles réussis", value: t ? `${int.format(t.pass)} / ${int.format(total)}` : "—",
        deltaNote: t ? (t.fail ? `${t.fail} en échec : les chiffres sont à vérifier` : t.warn ? `${t.warn} avertissement(s) à la dernière exécution` : "à la dernière exécution") : "Lancez dbt build, puis régénérez le cockpit.",
        headline: ["Si un total s'écarte d'", h("em", { text: "un cent" }), " de celui de la caisse, rien n'est publié."],
        range: Q ? `dbt ${Q.dbt_version} · contrôles joués en ${dec1.format(Q.elapsed_seconds)} s` : null }),
      h("div", { class: "hero-right" },
        h("div", { class: "hero-tools" }, h("div", { class: "eyebrow", text: "Du ticket de caisse au tableau de bord" })),
        h("div", { class: "flow" }, steps.map(([title, where, text], i) => h("div", { class: "step" },
          h("span", { class: "n", text: String(i + 1) }), h("b", { text: title }), h("span", { class: "where", text: where }), h("p", { text: text })))))];

    const tiles = [];
    if (last) tiles.push(kpi({ label: "Dernier chargement", value: last.status === "success" ? "Réussi" : last.status === "failed" ? "Échec" : "En cours", note: `${stamp(last.finished_at || last.started_at)} · ${int.format(last.rows_processed || 0)} lignes` }));
    tiles.push(kpi({ label: "Jours de ventes suivis", value: int.format(DAILY.length), note: `du ${dFull(META.first_day)} au ${dFull(META.last_day)}` }));
    if (Q) tiles.push(kpi({ label: "Tables et vues", value: int.format(L.staging + L.intermediate + L.marts), note: `${L.marts} tables d'analyse, ${L.staging + L.intermediate} vues de préparation` }));
    tiles.push(kpi({ label: "Moteur", value: META.engine === "snowflake" ? "Snowflake" : "DuckDB", note: META.engine === "snowflake" ? "entrepôt du projet" : "exécution locale de démonstration" }));

    const view = [kpiRow(tiles)];
    if (Q) {
      const ic = (st) => h("span", { class: "ic " + (st === "pass" ? "" : st), "aria-label": st === "pass" ? "réussi" : st === "warn" ? "avertissement" : "échec", text: st === "pass" ? "✓" : st === "warn" ? "!" : "×" });
      const stOf = (g) => (g.fail ? "fail" : g.warn ? "warn" : "pass");
      const pretty = (name) => name.replace(/^assert_/, "").replace(/_/g, " ");
      view.push(card("tests", "c7", "Ce qui est vérifié à chaque exécution", "Si une règle échoue, le pipeline s'arrête avant que le chiffre faux n'arrive ici.", h("div", null,
        h("div", { class: "sub-h", text: "Règles métier" }),
        h("ul", { class: "checks" }, Q.rules.map((r) => h("li", null, ic(r.status), h("div", null, r.description || pretty(r.name), h("small", { class: "mono", text: r.name })), h("span")))),
        h("div", { class: "sub-h", text: "Calculs testés sur des cas d'école" }),
        h("ul", { class: "checks" }, Q.unit_tests.map((r) => h("li", null, ic(r.status), h("div", null, r.description || pretty(r.name), h("small", { class: "mono", text: r.name })), h("span")))),
        h("div", { class: "sub-h", text: "Contrôles de structure" }),
        h("ul", { class: "checks" }, Q.groups.map((g) => h("li", null, ic(stOf(g)), h("div", { text: g.label }), h("span", { class: "n", text: `${g.pass} / ${g.pass + g.warn + g.fail}` })))))));
      view.push(card("glossary", "c5", "Comment lire les chiffres", "Les mêmes définitions partout, du SQL au tableau de bord.", h("dl", { class: "glossary" },
        [["Vente brute", "Articles et extras, avant rabais, hors taxes."],
         ["Vente nette", "Vente brute − rabais − remboursements. Hors taxes et hors pourboires."],
         ["Panier moyen", "Ventes nettes divisées par le nombre de commandes payées."],
         ["Marge unitaire", "Vente nette d'un article − son coût matière estimé."],
         ["Vedette, Valeur sûre, Énigme, Poids mort", "Classement de la carte : populaire ou non, rentable ou non, au sein de sa catégorie."],
         ["Fréquence par rapport au hasard", "× 2 : la paire est commandée deux fois plus souvent que si les deux produits étaient choisis indépendamment."]]
          .map(([term, def]) => h("div", null, h("dt", { text: term }), h("dd", { text: def }))))));
      view.push(card("marts", "c12", "Les tables que vous pouvez interroger", "Toutes sont documentées colonne par colonne dans la documentation dbt.", tableNode({
        cols: [{ label: "Table" }, { label: "Contenu", cls: "muted" }, { label: "Lignes", num: true }],
        rows: Q.marts.map((mt) => [h("span", { class: "mono", text: mt.name }), mt.description, int.format(mt.rows || 0)]) })));
    } else {
      view.push(card("noq", "c12", "Résultats de contrôle indisponibles", "Lancez `dbt build` puis régénérez le cockpit pour afficher les contrôles.", h("div", { class: "empty", text: "Aucun résultat dbt trouvé." })));
    }
    return { hero, view };
  }

  /* ---------- cadre ---------- */
  function toggleTheme() {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("cockpit-theme", root.dataset.theme); } catch (_) { /* stockage indisponible : le choix vaut pour cette visite */ }
  }
  function renderChrome() {
    document.getElementById("brand-name").textContent = META.client.name;
    document.title = `Cockpit · ${META.client.name}`;
    document.getElementById("brand-sub").textContent = META.client.tagline;
    const ok = Q ? Q.totals.fail === 0 : null;
    document.getElementById("top-meta").replaceChildren(...[
      META.is_demo && h("span", { class: "pill demo" }, h("span", { class: "dot" }), "Données simulées"),
      ok != null && h("span", { class: "pill " + (ok ? "ok" : "ko") }, h("span", { class: "dot" }), ok ? "Contrôles réussis" : "Contrôles en échec"),
      h("span", { class: "pill", text: `Données au ${dFull(META.last_day)}` }),
      h("button", { class: "icon-btn", type: "button", "aria-label": "Basculer entre thème clair et thème sombre", title: "Thème clair ou sombre", onclick: toggleTheme },
        s("svg", { width: 15, height: 15, viewBox: "0 0 16 16", "aria-hidden": "true" }, s("circle", { cx: 8, cy: 8, r: 6.5, fill: "none", stroke: "currentColor", "stroke-width": 1.5 }), s("path", { d: "M8 1.5a6.5 6.5 0 0 1 0 13z", fill: "currentColor" })))].filter(Boolean));
    document.getElementById("tabs").replaceChildren(...TABS.map((t) => h("button", { class: "tab", role: "tab", type: "button", id: "tab-" + t.id, "aria-selected": String(state.tab === t.id), text: t.label,
      onclick: () => { state.tab = t.id; try { history.replaceState(null, "", "#" + t.id); } catch (_) { location.hash = t.id; } render(); } })));
    document.getElementById("footer").replaceChildren(
      h("span", { text: META.is_demo ? "Données simulées : aucune donnée réelle du restaurant n'apparaît sur cette page." : "Données de la caisse du restaurant." }),
      h("span", { text: `Page générée le ${stamp(META.generated_at)}` }));
  }
  function render() {
    tip.hide();
    pending.length = 0;
    renderChrome();
    const out = state.tab === "ventes" ? viewVentes() : state.tab === "carte" ? viewCarte() : viewFiabilite();
    document.getElementById("hero").replaceChildren(...out.hero.filter(Boolean));
    document.getElementById("view").replaceChildren(...out.view.filter(Boolean));
    flush();
  }
  try { const saved = localStorage.getItem("cockpit-theme"); if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved; } catch (_) { /* thème du système */ }
  let resizeTimer = null, lastWidth = 0;
  addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { const wd = document.getElementById("view").clientWidth; if (wd !== lastWidth) { lastWidth = wd; render(); } }, 150); });
  addEventListener("hashchange", () => { fromHash(); render(); });
  fromHash();
  render();
  lastWidth = document.getElementById("view").clientWidth;
})();
</script>
