<title>Cockpit des ventes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Mise en page : un bandeau, trois onglets, une ligne de filtres, puis des blocs sur une grille de 12 colonnes. */
:root {
  --plane: #f6f6f3;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #77756f;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --brand: #c4321c;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --soft-bar: #b7d3f6;
  --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #104281;
  --on-fill: #ffffff;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
  --delta-good: #006300; --delta-bad: #b42a2a;
  --font-display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --plane: #0d0d0d; --surface: #1a1a19; --surface-2: #262624; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #96948d;
    --grid: #2c2c2a; --axis: #46463f; --border: rgba(255, 255, 255, 0.10); --brand: #ef6a52;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --soft-bar: #184f95;
    --seq-1: #0d366b; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec; --seq-6: #9ec5f4;
    --delta-good: #0ca30c; --delta-bad: #e66767; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --plane: #0d0d0d; --surface: #1a1a19; --surface-2: #262624; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #96948d;
  --grid: #2c2c2a; --axis: #46463f; --border: rgba(255, 255, 255, 0.10); --brand: #ef6a52;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --soft-bar: #184f95;
  --seq-1: #0d366b; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec; --seq-6: #9ec5f4;
  --delta-good: #0ca30c; --delta-bad: #e66767; color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--plane); color: var(--ink); font: 400 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }

.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Bandeau */
.top { background: var(--surface); border-bottom: 1px solid var(--border); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding-block: 14px 0; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand-name { font: 700 22px/1 var(--font-display); letter-spacing: -0.01em; }
.brand-sub { color: var(--ink-3); font-size: 13px; }
.top-meta { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13px; color: var(--ink-2); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); font-size: 12.5px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.pill.demo .dot { background: var(--warning); }
.pill.ok .dot { background: var(--good); }
.pill.ko .dot { background: var(--critical); }
.tabs { display: flex; gap: 4px; width: 100%; overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 14px 12px; border-bottom: 2px solid transparent; color: var(--ink-2); font-weight: 500; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

/* Filtres */
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 18px 6px; }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--border); }
.seg button { border: 0; background: none; padding: 5px 13px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--border); }
.range-note { color: var(--ink-2); font-size: 13.5px; }

/* Grille */
main { padding-block: 8px 40px; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; } .c5 { grid-column: span 5; } .c4 { grid-column: span 4; }
@media (max-width: 980px) { .c8, .c7, .c6, .c5, .c4 { grid-column: span 12; } }

/* Chiffres clés */
.kpis { grid-column: span 12; display: grid; grid-template-columns: 1.5fr repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.kpis.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpis.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { padding: 18px 20px 16px; border-left: 1px solid var(--grid); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi-label { color: var(--ink-2); font-size: 13.5px; }
.kpi-value { font-weight: 600; font-size: 26px; line-height: 1.15; letter-spacing: -0.01em; }
.kpi.hero .kpi-value { font-size: 50px; line-height: 1.05; letter-spacing: -0.025em; }
.kpi-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 6px; min-height: 30px; }
.kpi-note { color: var(--ink-3); font-size: 12.5px; }
.delta { font-size: 13px; font-weight: 600; white-space: nowrap; }
.delta.good { color: var(--delta-good); } .delta.bad { color: var(--delta-bad); } .delta.flat { color: var(--ink-3); }
.delta small { font-weight: 400; color: var(--ink-3); font-size: 12px; margin-left: 4px; }
.spark { flex: none; }
@media (max-width: 980px) {
  .kpis, .kpis.three, .kpis.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi.hero { grid-column: span 2; }
  .kpi { border-left: 0; border-top: 1px solid var(--grid); }
  .kpi.hero .kpi-value { font-size: 42px; }
}

/* Blocs */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px 16px; min-width: 0; display: flex; flex-direction: column; }
.card-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.card-head h2 { margin: 0; font: 600 17px/1.25 var(--font-display); letter-spacing: -0.005em; text-wrap: balance; }
.card-head p { margin: 3px 0 0; color: var(--ink-2); font-size: 13.5px; }
.card-head .txt { min-width: 0; flex: 1; }
.ghost { flex: none; border: 1px solid var(--border); background: none; border-radius: 7px; padding: 3px 9px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.ghost:hover { background: var(--surface-2); color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.key.line { height: 2px; width: 16px; border-radius: 1px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: var(--font-body); }
.t-axis { fill: var(--ink-3); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.t-label { fill: var(--ink); font-size: 12px; font-weight: 500; }
.t-quad { fill: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--axis); stroke-width: 1; }
.empty { color: var(--ink-3); font-size: 14px; padding: 24px 0; }

/* Tableaux */
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12.5px; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-right: 14px; }
td.muted { color: var(--ink-2); }
.mono { font-family: var(--font-mono); font-size: 12.5px; }

/* Barres classées */
.rank { display: grid; grid-template-columns: minmax(110px, 0.9fr) minmax(60px, 1.6fr) auto auto; gap: 9px 12px; align-items: center; font-size: 13.5px; }
.rank .name { min-width: 0; overflow-wrap: anywhere; }
.rank .name small { display: block; color: var(--ink-3); font-size: 12px; }
.rank .track { height: 12px; }
.rank .bar { height: 12px; border-radius: 0 4px 4px 0; background: var(--series-1); min-width: 2px; }
.rank .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.rank .sub { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: 12.5px; }

/* Barre segmentée */
.segbar { display: flex; gap: 2px; height: 28px; }
.segbar > div { border-radius: 4px; min-width: 2px; display: flex; align-items: center; padding-left: 8px; font-size: 12.5px; font-weight: 600; color: var(--on-fill); overflow: visible; white-space: nowrap; }
.seglist { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px 12px; align-items: center; margin-top: 14px; font-size: 13.5px; }
.seglist-wide { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px 32px; margin-top: 14px; font-size: 13.5px; }
.segrow { display: flex; align-items: center; gap: 8px; }
.segrow .v { margin-left: auto; font-variant-numeric: tabular-nums; }
.segrow .p { font-variant-numeric: tabular-nums; color: var(--ink-3); min-width: 48px; text-align: right; }
.r2 { grid-row: span 2; }
.seglist .v { text-align: right; font-variant-numeric: tabular-nums; }
.seglist .p { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-3); min-width: 44px; }

/* Affluence */
.heat { display: grid; gap: 2px; font-size: 11.5px; }
.heat .hl { color: var(--ink-3); display: flex; align-items: center; padding-right: 8px; font-size: 12.5px; }
.heat .hh { color: var(--ink-3); text-align: center; font-variant-numeric: tabular-nums; padding-top: 4px; }
.heat .cell { aspect-ratio: 1.55; border-radius: 3px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-weight: 600; min-width: 0; }
.heat .cell:hover { outline: 2px solid var(--ink); outline-offset: -1px; }
.heat-scale { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--ink-3); font-size: 12.5px; }
.heat-scale i { display: block; width: 22px; height: 10px; border-radius: 2px; }
.heat-scale .steps { display: flex; gap: 2px; }

/* Classement de la carte */
.klass { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border: 1px solid var(--border); border-radius: 999px; font-size: 12.5px; font-weight: 500; white-space: nowrap; background: var(--surface-2); }
.meter { display: flex; align-items: center; gap: 10px; }
.meter .track { flex: 1; min-width: 60px; height: 8px; border-radius: 4px; background: var(--seq-1); }
.meter .fill { height: 8px; border-radius: 4px; background: var(--series-1); }
.meter b { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }

/* Fiabilité */
.flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 26px; }
.step { position: relative; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--plane); min-width: 0; }
.step b { display: block; font: 600 15px/1.2 var(--font-display); }
.step .where { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); }
.step p { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
.step:not(:last-child)::after { content: "→"; position: absolute; right: -21px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 16px; }
@media (max-width: 980px) { .flow { grid-template-columns: 1fr; gap: 22px; } .step:not(:last-child)::after { content: "↓"; right: auto; left: 50%; top: auto; bottom: -21px; transform: translateX(-50%); } }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.checks li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: start; font-size: 14px; }
.checks .ic { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; background: var(--good); margin-top: 1px; }
.checks .ic.warn { background: var(--warning); color: #0b0b0b; } .checks .ic.fail { background: var(--critical); }
.checks small { display: block; color: var(--ink-3); font-size: 12.5px; }
.checks.reading { gap: 16px; }
.checks.reading .glyph { font-size: 15px; color: var(--ink-2); text-align: center; }
.checks.reading .names { margin-top: 2px; }
.checks .n { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sub-h { font: 600 13px/1 var(--font-body); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.07em; margin: 18px 0 10px; }
.sub-h:first-child { margin-top: 0; }
dl.glossary { margin: 0; display: grid; gap: 12px; font-size: 14px; }
dl.glossary dt { font-weight: 600; }
dl.glossary dd { margin: 1px 0 0; color: var(--ink-2); }

.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.14); padding: 9px 11px; font-size: 13px; max-width: 280px; }
.tip h4 { margin: 0 0 5px; font: 500 12.5px/1.2 var(--font-body); color: var(--ink-2); }
.tip .row { display: flex; align-items: center; gap: 8px; }
.tip .row b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tip .row span { color: var(--ink-2); }
.tip .row i { width: 12px; height: 2px; border-radius: 1px; flex: none; }
.tip p { margin: 6px 0 0; color: var(--ink-2); font-size: 12.5px; }

footer { color: var(--ink-3); font-size: 12.5px; padding-block: 0 28px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
@media (prefers-reduced-motion: no-preference) { .bar, .fill { transition: width 0.25s ease; } }
</style>

<div class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M15 3.2c5 0 9.4 1.6 12.2 4.2L15 27.4 2.8 7.4C5.6 4.8 10 3.2 15 3.2z" fill="var(--brand)"/>
        <circle cx="12" cy="10.5" r="2" fill="var(--surface)"/><circle cx="17.6" cy="13.6" r="1.7" fill="var(--surface)"/><circle cx="14.4" cy="17.8" r="1.5" fill="var(--surface)"/>
      </svg>
      <div>
        <div class="brand-name" id="brand-name"></div>
        <div class="brand-sub" id="brand-sub"></div>
      </div>
    </div>
    <div class="top-meta" id="top-meta"></div>
    <div class="tabs" role="tablist" aria-label="Sections du cockpit" id="tabs"></div>
  </div>
</div>
<div class="wrap">
  <div class="filters" id="filters"></div>
  <main><div class="grid" id="view"></div></main>
  <footer id="footer"></footer>
</div>
<div class="tip" id="tip" hidden></div>

<script type="application/json" id="cockpit-data">/*__COCKPIT_DATA__*/</script>
<script>
(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("cockpit-data").textContent);
  const META = DATA.meta;
  const LOCALE = META.client.locale;
  const objects = (t) => t.rows.map((r) => Object.fromEntries(t.cols.map((c, i) => [c, r[i]])));
  const DAILY = objects(DATA.daily), CHANNELS = objects(DATA.channels), TENDERS = objects(DATA.tenders);
  const HOURLY = objects(DATA.hourly), PRODUCT_DAILY = objects(DATA.product_daily);
  const PRODUCTS = new Map(objects(DATA.products).map((p) => [p.product_id, p]));
  const MENU = objects(DATA.menu), PAIRS = objects(DATA.pairs), RUNS = objects(DATA.runs), Q = DATA.quality;

  /* ---------- formats ---------- */
  const nf = (o) => new Intl.NumberFormat(LOCALE, o);
  const money0 = nf({ style: "currency", currency: META.client.currency, maximumFractionDigits: 0 });
  const money2 = nf({ style: "currency", currency: META.client.currency, minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const int = nf({ maximumFractionDigits: 0 });
  const dec1 = nf({ minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const pct = (v, d = 1) => nf({ style: "percent", minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
  const toDate = (iso) => new Date(iso + "T00:00:00Z");
  const dfmt = (o) => new Intl.DateTimeFormat(LOCALE, { timeZone: "UTC", ...o });
  const dShort = (iso) => dfmt({ day: "numeric", month: "short" }).format(toDate(iso));
  const dLong = (iso) => dfmt({ weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(toDate(iso));
  const dFull = (iso) => dfmt({ day: "numeric", month: "long", year: "numeric" }).format(toDate(iso));
  const dMonth = (iso) => dfmt({ month: "short", year: "2-digit" }).format(toDate(iso));
  const addDays = (iso, n) => new Date(toDate(iso).getTime() + n * 864e5).toISOString().slice(0, 10);
  const WEEKDAYS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
  const WD_SHORT = ["lun.", "mar.", "mer.", "jeu.", "ven.", "sam.", "dim."];
  const sum = (rows, f) => rows.reduce((a, r) => a + (f(r) || 0), 0);

  /* ---------- DOM ---------- */
  const SVG_NS = "http://www.w3.org/2000/svg";
  function build(el, attrs, kids) {
    for (const k in attrs || {}) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat(3)) {
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const h = (tag, attrs, ...kids) => build(document.createElement(tag), attrs, kids);
  const s = (tag, attrs, ...kids) => build(document.createElementNS(SVG_NS, tag), attrs, kids);
  const cssVar = (name) => `var(--${name})`;

  /* ---------- infobulle ---------- */
  const tipEl = document.getElementById("tip");
  const tip = {
    show(evt, title, rows, note) {
      tipEl.replaceChildren(
        h("h4", { text: title }),
        ...rows.map((r) => h("div", { class: "row" }, r.color && h("i", { style: `background:${r.color}` }), h("b", { text: r.value }), h("span", { text: r.label }))),
        note && h("p", { text: note })
      );
      tipEl.hidden = false;
      const w = tipEl.offsetWidth, hh = tipEl.offsetHeight;
      let x = evt.clientX + 14, y = evt.clientY + 14;
      if (x + w > innerWidth - 8) x = evt.clientX - w - 14;
      if (y + hh > innerHeight - 8) y = evt.clientY - hh - 14;
      tipEl.style.left = Math.max(8, x) + "px";
      tipEl.style.top = Math.max(8, y) + "px";
    },
    hide() { tipEl.hidden = true; },
  };
  const hover = (el, fn) => {
    el.addEventListener("pointermove", (e) => fn(e));
    el.addEventListener("pointerleave", tip.hide);
    return el;
  };

  /* ---------- état ---------- */
  const PERIODS = [{ days: 30, label: "30 jours" }, { days: 90, label: "90 jours" }, { days: 365, label: "12 mois" }];
  const TABS = [{ id: "ventes", label: "Ventes" }, { id: "carte", label: "Carte" }, { id: "fiabilite", label: "Fiabilité des données" }];
  const state = { tab: "ventes", days: 90, tables: new Set() };
  const fromHash = () => { const id = location.hash.slice(1); if (TABS.some((t) => t.id === id)) state.tab = id; };

  function windowOf(days) {
    const end = META.last_day;
    const start = addDays(end, -(days - 1)) < META.first_day ? META.first_day : addDays(end, -(days - 1));
    const prevEnd = addDays(start, -1), prevStart = addDays(start, -days);

    const leakNode = tableNode({ cols: [{ label: "" }, { label: "Commandes", num: true }, { label: "Part", num: true }, { label: "Montant", num: true }], rows: [
      ["Avec un rabais", int.format(sum(days, (d) => d.discounted_orders)), share(sum(days, (d) => d.discounted_orders)), money0.format(sum(days, (d) => d.discount_amount))],
      ["Remboursées", int.format(sum(days, (d) => d.refunded_orders)), share(sum(days, (d) => d.refunded_orders)), money0.format(sum(days, (d) => d.refund_amount))]] });
    return [kpis,
      card("trend", "c12", "Ventes nettes par jour", "La moyenne mobile lisse l'effet du week-end et montre la vraie tendance.", trendChart(days, width - 42), trendTable),
      card("heat", "c7", "Affluence par heure", "Commandes par heure en moyenne, pour chaque jour de la semaine : de quoi caler les quarts de travail.", heat.node, heat.table),
      card("weekday", "c5", "Une journée type, selon le jour", `Ventes nettes moyennes d'une journée d'ouverture. Le ${bestWd.label} est le meilleur jour.`,
        columns(byWd, [{ name: "Ventes nettes", color: cssVar("series-1") }], width > 980 ? (width - 16) * 5 / 12 - 42 : width - 42, { height: 318, labelCaps: true }), wdTable),
      card("channel", "c7 r2", "Sur place, à emporter, livraison", "Ventes nettes par type de commande. Le pourcentage indique la part de chaque type sur la période.",
        h("div", null, chLegend, columns(chGroups, chSeries, width > 980 ? (width - 16) * 7 / 12 - 42 : width - 42, { height: 300 })), chTable),
      card("tender", "c5", "Moyens de paiement", "Montants encaissés, taxes et pourboires compris.", segmented(tenderParts, (v) => money0.format(v))),
      card("leak", "c5", "Rabais et remboursements", "Ce qui sépare les ventes brutes des ventes nettes.", leakNode)];
  }

  /* ---------- onglet Carte ---------- */
  function scatter(items, width) {
    const W = Math.max(320, width), H = 380, m = { l: 56, r: 24, t: 26, b: 44 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const xs = items.map((d) => d.mix_share), ys = items.map((d) => d.unit_margin), thX = items[0].popularity_threshold, thY = items[0].category_unit_margin;
    const xMax = Math.max(...xs) * 1.18, yMin = Math.min(...ys, thY), yMax = Math.max(...ys, thY), pad = (yMax - yMin) * 0.22 || 1;
    const y0 = yMin - pad, y1 = yMax + pad;
    const x = (v) => m.l + (v / xMax) * iw, y = (v) => m.t + ih - ((v - y0) / (y1 - y0)) * ih;
    const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Popularité et marge unitaire de chaque pizza" });
    svg.append(s("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "none", stroke: cssVar("grid") }));
    for (const t of niceTicks(xMax, 5)) if (t > 0 && t < xMax) svg.append(s("text", { class: "t-axis", x: x(t), y: H - 24, "text-anchor": "middle", text: pct(t, 0) }));
    const yStep = (y1 - y0) > 4 ? 1 : 0.5;
    for (let t = Math.ceil(y0 / yStep) * yStep; t <= y1; t += yStep) svg.append(s("text", { class: "t-axis", x: m.l - 8, y: y(t) + 4, "text-anchor": "end", text: money2.format(t) }));
    svg.append(s("text", { class: "t-axis", x: m.l + iw / 2, y: H - 6, "text-anchor": "middle", text: "Popularité : part des pizzas vendues →" }));
    svg.append(s("text", { class: "t-axis", x: m.l, y: 12, text: "Marge par pizza ↑" }));
    svg.append(s("line", { class: "baseline", x1: x(thX), x2: x(thX), y1: m.t, y2: m.t + ih }), s("line", { class: "baseline", x1: m.l, x2: m.l + iw, y1: y(thY), y2: y(thY) }));
    [["Énigme", m.l + 10, m.t + 18, "start"], ["Vedette", m.l + iw - 10, m.t + 18, "end"], ["Poids mort", m.l + 10, m.t + ih - 10, "start"], ["Valeur sûre", m.l + iw - 10, m.t + ih - 10, "end"]]
      .forEach(([t, tx, ty, a]) => svg.append(s("text", { class: "t-quad", x: tx, y: ty, "text-anchor": a, text: t })));
    /* étiquettes : première position libre autour du point */
    const boxes = items.map((d) => ({ x0: x(d.mix_share) - 9, x1: x(d.mix_share) + 9, y0: y(d.unit_margin) - 9, y1: y(d.unit_margin) + 9 }));
    const overlaps = (b) => boxes.some((o) => b.x0 < o.x1 && b.x1 > o.x0 && b.y0 < o.y1 && b.y1 > o.y0);
    [...items].sort((p, q) => q.mix_share - p.mix_share).forEach((d) => {
      const name = d.product_name.replace(/^Pizza /, ""), tw = name.length * 6.6 + 4, px = x(d.mix_share), py = y(d.unit_margin);
      const cands = [["start", px + 11, py + 4], ["end", px - 11, py + 4], ["middle", px, py - 12], ["middle", px, py + 22]];
      let pick = cands[0], box = null;
      for (const c of cands) {
        const bx0 = c[0] === "start" ? c[1] : c[0] === "end" ? c[1] - tw : c[1] - tw / 2;
        const b = { x0: bx0, x1: bx0 + tw, y0: c[2] - 11, y1: c[2] + 3 };
        if (b.x0 >= m.l + 2 && b.x1 <= m.l + iw - 2 && b.y0 >= m.t + 2 && b.y1 <= m.t + ih - 2 && !overlaps(b)) { pick = c; box = b; break; }
      }
      if (box) boxes.push(box);
      svg.append(s("text", { class: "t-label", x: pick[1], y: pick[2], "text-anchor": pick[0], text: name }));
    });
    items.forEach((d) => {
      svg.append(s("circle", { cx: x(d.mix_share), cy: y(d.unit_margin), r: 6, fill: cssVar("series-1"), stroke: cssVar("surface"), "stroke-width": 2 }));
      svg.append(hover(s("circle", { cx: x(d.mix_share), cy: y(d.unit_margin), r: 15, fill: "transparent" }), (e) => tip.show(e, `${d.product_name} — ${d.menu_class}`, [
        { value: pct(d.mix_share), label: "des pizzas vendues" }, { value: money2.format(d.unit_margin), label: "de marge par pizza" }, { value: int.format(d.quantity_sold), label: "vendues" }], d.recommended_action)));
    });
    return h("div", { class: "chart" }, svg);
  }
  const KLASS_ICON = { "Vedette": "★", "Valeur sûre": "●", "Énigme": "◆", "Poids mort": "▽" };

  function viewCarte(width) {
    const w = windowOf(state.days), rows = within(PRODUCT_DAILY, "order_date", w);
    const by = new Map();
    for (const r of rows) {
      const o = by.get(r.product_id) || { id: r.product_id, qty: 0, net: 0, cost: 0, extras: 0 };
      o.qty += r.quantity; o.net += r.net_sales; o.cost += r.estimated_cost || 0; o.extras += r.lines_with_extras; by.set(r.product_id, o);
    }
    const list = [...by.values()].map((o) => ({ ...o, ...PRODUCTS.get(o.id) })).sort((p, q) => q.net - p.net);
    const net = sum(list, (o) => o.net), qty = sum(list, (o) => o.qty), cost = sum(list, (o) => o.cost);
    const pizzas = list.filter((o) => o.category === "Pizzas"), pizzaQty = sum(pizzas, (o) => o.qty);
    const newest = [...PRODUCTS.values()].filter((p) => p.first_sold_date > META.first_day).sort((p, q) => (q.first_sold_date > p.first_sold_date ? 1 : -1))[0];
    const newestRank = newest ? list.findIndex((o) => o.id === newest.product_id) + 1 : 0;
    const kpis = h("div", { class: "kpis four" },
      kpi({ label: "Articles vendus", value: int.format(qty), note: `${list.length} produits à la carte` }),
      kpi({ label: "Coût matière estimé", value: pct(cost / Math.max(1, net)), note: "des ventes nettes, selon le catalogue des coûts" }),
      kpi({ label: "Pizzas avec un extra", value: pct(sum(pizzas, (o) => o.extras) / Math.max(1, pizzaQty)), note: "extra fromage, champignons, sans gluten…" }),
      kpi({ label: "Dernière nouveauté", value: newest ? newest.product_name.replace(/^Pizza /, "") : "—", note: newest ? `à la carte depuis le ${dFull(newest.first_sold_date)}` + (newestRank ? ` · ${newestRank}ᵉ vente de la période` : "") : "" }));

    const top = list.slice(0, 10), topMax = top.length ? top[0].net : 1;
    const rank = h("div", { class: "rank" }, top.map((o) => [
      h("div", { class: "name" }, o.product_name, h("small", { text: o.category })),
      hover(h("div", { class: "track" }, h("div", { class: "bar", style: `width:${(o.net / topMax) * 100}%` })), (e) => tip.show(e, o.product_name, [
        { value: money0.format(o.net), label: "ventes nettes" }, { value: int.format(o.qty), label: "unités" }, { value: pct(o.net / Math.max(1, net)), label: "des ventes" }])),
      h("div", { class: "val", text: money0.format(o.net) }), h("div", { class: "sub", text: int.format(o.qty) + " u." })]));
    const catParts = foldParts(CATEGORY_ORDER, (c) => sum(list.filter((o) => o.category === c), (o) => o.net));

    const menuPizzas = MENU.filter((d) => d.category === "Pizzas");
    const menuTable = { cols: [{ label: "Produit" }, { label: "Catégorie", cls: "muted" }, { label: "Vendus", num: true }, { label: "Part", num: true }, { label: "Marge unitaire", num: true }, { label: "Classement" }, { label: "Piste d'action", cls: "muted" }],
      rows: MENU.map((d) => [d.product_name, d.category, int.format(d.quantity_sold), pct(d.mix_share), money2.format(d.unit_margin),
        h("span", { class: "klass" }, h("span", { "aria-hidden": "true", text: KLASS_ICON[d.menu_class] || "" }), d.menu_class), d.recommended_action]) };

    const pairs = PAIRS.filter((p) => p.lift > 1.1).slice(0, 8), liftMax = Math.max(...pairs.map((p) => p.lift), 1);
    const pairsNode = pairs.length ? tableNode({ cols: [{ label: "Paire" }, { label: "Commandes ensemble", num: true }, { label: "Fréquence par rapport au hasard" }],
      rows: pairs.map((p) => [`${p.product_a_name} + ${p.product_b_name}`, int.format(p.orders_together),
        h("div", { class: "meter" }, h("div", { class: "track" }, h("div", { class: "fill", style: `width:${(p.lift / liftMax) * 100}%` })), h("b", { text: "× " + dec1.format(p.lift) }))]) })
      : h("div", { class: "empty", text: "Pas encore assez de commandes pour faire ressortir des associations." });

    const windowDays = 90;
    const KLASS_TEXT = { "Vedette": "populaire et rentable", "Valeur sûre": "populaire, marge sous la moyenne", "Énigme": "rentable, mais peu commandée", "Poids mort": "peu commandée et peu rentable" };
    const reading = h("ul", { class: "checks reading" }, Object.keys(KLASS_TEXT).map((k) => {
      const items = menuPizzas.filter((d) => d.menu_class === k);
      return h("li", null, h("span", { class: "glyph", "aria-hidden": "true", text: KLASS_ICON[k] }),
        h("div", null, h("b", { text: k }), ` — ${KLASS_TEXT[k]}`,
          h("div", { class: "names", text: items.length ? items.map((d) => d.product_name.replace(/^Pizza /, "")).join(", ") : "aucune pizza" }),
          items.length ? h("small", { text: items[0].recommended_action }) : null), h("span"));
    }));
    return [kpis,
      card("top", "c7", "Les 10 produits qui rapportent le plus", "Ventes nettes sur la période, rabais et remboursements déduits.", rank,
        { cols: [{ label: "Produit" }, { label: "Catégorie", cls: "muted" }, { label: "Unités", num: true }, { label: "Ventes nettes", num: true }, { label: "Part", num: true }],
          rows: list.map((o) => [o.product_name, o.category, int.format(o.qty), money0.format(o.net), pct(o.net / Math.max(1, net))]) }),
      card("pairs", "c5", "Souvent commandés ensemble", `Associations plus fréquentes que le hasard sur les ${windowDays} derniers jours : des idées de suggestions et de formules.`, pairsNode),
      card("cats", "c12", "Répartition par catégorie", "Part de chaque catégorie dans les ventes nettes de la période.", segmented(catParts, (v) => money0.format(v), true)),
      card("matrix", "c7", "Quelles pizzas pousser, lesquelles revoir", `Chaque pizza selon sa popularité et sa marge, sur les ${windowDays} derniers jours. Les deux lignes sont les seuils de la méthode Kasavana-Smith.`,
        menuPizzas.length ? scatter(menuPizzas, width > 980 ? (width - 16) * 7 / 12 - 42 : width - 42) : h("div", { class: "empty", text: "Aucun coût renseigné pour les pizzas." })),
      card("reading", "c5", "Lecture de la matrice", "Quatre familles, quatre décisions.", reading),
      card("menu", "c12", "Classement complet de la carte", "Chaque produit est comparé aux autres produits de sa catégorie.", tableNode(menuTable))];
  }

  /* ---------- onglet Fiabilité ---------- */
  function viewFiabilite() {
    const last = RUNS[0];
    const when = (iso) => new Intl.DateTimeFormat(LOCALE, { dateStyle: "long", timeStyle: "short" }).format(new Date(iso));
    const out = [];
    const tiles = [];
    if (Q) {
      const t = Q.totals, total = t.pass + t.warn + t.fail;
      tiles.push(kpi({ label: "Contrôles réussis", value: `${int.format(t.pass)} / ${int.format(total)}`, note: t.fail ? `${t.fail} en échec : les chiffres sont à vérifier` : t.warn ? `${t.warn} avertissement(s)` : "à la dernière exécution" }));
    }
    if (last) tiles.push(kpi({ label: "Dernier chargement", value: last.status === "success" ? "Réussi" : last.status === "failed" ? "Échec" : "En cours", note: `${when(last.finished_at || last.started_at)} · ${int.format(last.rows_processed || 0)} lignes` }));
    if (Q) {
      tiles.push(kpi({ label: "Tables et vues", value: int.format(Q.layers.staging + Q.layers.intermediate + Q.layers.marts), note: `${Q.layers.marts} tables d'analyse, ${Q.layers.staging + Q.layers.intermediate} vues de préparation` }));
      tiles.push(kpi({ label: "Moteur", value: META.engine === "snowflake" ? "Snowflake" : "DuckDB", note: `${META.engine === "snowflake" ? "entrepôt du projet" : "exécution locale de démonstration"} · dbt ${Q.dbt_version}` }));
    }
    if (tiles.length) out.push(h("div", { class: "kpis " + (tiles.length === 4 ? "four" : "three") }, tiles));

    const L = Q ? Q.layers : null;
    out.push(card("flow", "c12", "Du ticket de caisse au tableau de bord", "Chaque étape est rejouable : relancer le pipeline ne crée jamais de doublon.", h("div", { class: "flow" },
      [["Caisse Clover", "API", "Chaque nuit, les commandes modifiées depuis le dernier passage sont relues."],
       ["Données brutes", "RAW", `Le JSON de la caisse est conservé tel quel${Q ? `, dans ${Q.sources} tables` : ""}. Rien n'est perdu.`],
       ["Préparation", "STAGING", `${L ? L.staging + L.intermediate : "Des"} vues : noms clairs, heure du restaurant, extras, rabais et remboursements dépliés.`],
       ["Analyse", "ANALYTICS", `${L ? L.marts : "Des"} tables documentées, prêtes à interroger : commandes, articles, rapports quotidiens.`],
       ["Cockpit", "HTML", "Cette page, régénérée après chaque exécution. La consulter ne coûte rien."]]
        .map(([t, wh, d]) => h("div", { class: "step" }, h("b", { text: t }), h("span", { class: "where", text: wh }), h("p", { text: d }))))));

    if (Q) {
      const ic = (st) => h("span", { class: "ic " + (st === "pass" ? "" : st), "aria-label": st === "pass" ? "réussi" : st === "warn" ? "avertissement" : "échec", text: st === "pass" ? "✓" : st === "warn" ? "!" : "×" });
      const stOf = (g) => (g.fail ? "fail" : g.warn ? "warn" : "pass");
      const pretty = (name) => name.replace(/^assert_/, "").replace(/_/g, " ");
      out.push(card("tests", "c7", "Ce qui est vérifié à chaque exécution", "Si une règle échoue, le pipeline s'arrête avant que le chiffre faux n'arrive ici.", h("div", null,
        h("div", { class: "sub-h", text: "Règles métier" }),
        h("ul", { class: "checks" }, Q.rules.map((r) => h("li", null, ic(r.status), h("div", null, r.description || pretty(r.name), h("small", { class: "mono", text: r.name })), h("span")))),
        h("div", { class: "sub-h", text: "Calculs testés sur des cas d'école" }),
        h("ul", { class: "checks" }, Q.unit_tests.map((r) => h("li", null, ic(r.status), h("div", null, r.description || pretty(r.name), h("small", { class: "mono", text: r.name })), h("span")))),
        h("div", { class: "sub-h", text: "Contrôles de structure" }),
        h("ul", { class: "checks" }, Q.groups.map((g) => h("li", null, ic(stOf(g)), h("div", { text: g.label }), h("span", { class: "n", text: `${g.pass} / ${g.pass + g.warn + g.fail}` })))))));
      out.push(card("glossary", "c5", "Comment lire les chiffres", "Les mêmes définitions partout, du SQL au tableau de bord.", h("dl", { class: "glossary" },
        [["Vente brute", "Articles et extras, avant rabais, hors taxes."],
         ["Vente nette", "Vente brute − rabais − remboursements. Hors taxes (TPS et TVQ) et hors pourboires."],
         ["Panier moyen", "Ventes nettes divisées par le nombre de commandes payées."],
         ["Marge unitaire", "Vente nette d'un article − son coût matière estimé."],
         ["Vedette, Valeur sûre, Énigme, Poids mort", "Classement de la carte : populaire ou non, rentable ou non, au sein de sa catégorie."],
         ["Fréquence par rapport au hasard", "× 2 : la paire est commandée deux fois plus souvent que si les deux produits étaient choisis indépendamment."]]
          .map(([t, d]) => h("div", null, h("dt", { text: t }), h("dd", { text: d }))))));
      out.push(card("marts", "c12", "Les tables que vous pouvez interroger", "Toutes sont documentées colonne par colonne dans la documentation dbt.", tableNode({
        cols: [{ label: "Table" }, { label: "Contenu", cls: "muted" }, { label: "Lignes", num: true }],
        rows: Q.marts.map((mt) => [h("span", { class: "mono", text: mt.name }), mt.description, int.format(mt.rows || 0)]) })));
    } else {
      out.push(card("noq", "c12", "Résultats de contrôle indisponibles", "Lancez `dbt build` puis régénérez le cockpit pour afficher les contrôles.", h("div", { class: "empty", text: "Aucun résultat dbt trouvé." })));
    }
    return out;
  }

  /* ---------- cadre ---------- */
  function renderChrome() {
    document.getElementById("brand-name").textContent = META.client.name;
    document.title = `Cockpit · ${META.client.name}`;
    document.getElementById("brand-sub").textContent = META.client.tagline;
    const ok = Q ? Q.totals.fail === 0 : null;
    document.getElementById("top-meta").replaceChildren(
      META.is_demo && h("span", { class: "pill demo" }, h("span", { class: "dot" }), "Données simulées"),
      ok != null && h("span", { class: "pill " + (ok ? "ok" : "ko") }, h("span", { class: "dot" }), ok ? "Contrôles réussis" : "Contrôles en échec"),
      h("span", { text: `Données au ${dFull(META.last_day)}` }));
    document.getElementById("tabs").replaceChildren(...TABS.map((t) => h("button", { class: "tab", role: "tab", type: "button", id: "tab-" + t.id, "aria-selected": String(state.tab === t.id), text: t.label,
      onclick: () => { state.tab = t.id; try { history.replaceState(null, "", "#" + t.id); } catch (_) { location.hash = t.id; } render(); } })));
    document.getElementById("footer").replaceChildren(
      h("span", { text: META.is_demo ? "Données simulées : aucune donnée réelle du restaurant n'apparaît sur cette page." : "Données de la caisse du restaurant." }),
      h("span", { text: `Page générée le ${new Intl.DateTimeFormat(LOCALE, { dateStyle: "long", timeStyle: "short" }).format(new Date(META.generated_at))}` }));
  }
  function renderFilters() {
    const el = document.getElementById("filters");
    if (state.tab === "fiabilite") { el.replaceChildren(); el.hidden = true; return; }
    el.hidden = false;
    const w = windowOf(state.days);
    el.replaceChildren(
      h("div", { class: "seg", role: "group", "aria-label": "Période" }, PERIODS.map((p) => h("button", { type: "button", id: "period-" + p.days, "aria-pressed": String(state.days === p.days), text: p.label,
        onclick: () => { state.days = p.days; render(); } }))),
      h("span", { class: "range-note", text: `Du ${dFull(w.start)} au ${dFull(w.end)}` + (w.prev ? `, comparé aux ${state.days} jours précédents` : "") }));
  }
  function render() {
    tip.hide();
    renderChrome();
    renderFilters();
    const view = document.getElementById("view"), width = view.clientWidth || 1200;
    const nodes = state.tab === "ventes" ? viewVentes(width) : state.tab === "carte" ? viewCarte(width) : viewFiabilite();
    view.replaceChildren(...nodes);
  }
  let resizeTimer = null, lastWidth = 0;
  addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { const wd = document.getElementById("view").clientWidth; if (wd !== lastWidth) { lastWidth = wd; render(); } }, 150); });
  addEventListener("hashchange", () => { fromHash(); render(); });
  fromHash();
  render();
  lastWidth = document.getElementById("view").clientWidth;
})();
</script>
