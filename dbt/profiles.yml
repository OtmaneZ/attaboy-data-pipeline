# Utilisé via DBT_PROFILES_DIR pointant sur ce dossier.
# Secrets uniquement via variables d'environnement (jamais en dur).
# Authentification par paire de clés (utilisateur de service ATTABOY_PIPELINE_SVC).
attaboy:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('ATTABOY_SF_ACCOUNT') }}"
      user: "{{ env_var('ATTABOY_SF_USER') }}"
      role: "{{ env_var('ATTABOY_SF_ROLE', 'ATTABOY_PIPELINE') }}"
      warehouse: "{{ env_var('ATTABOY_SF_WAREHOUSE', 'ATTABOY_WH') }}"
      database: "{{ env_var('ATTABOY_SF_DATABASE', 'ATTABOY_DW') }}"
      schema: ANALYTICS
      authenticator: snowflake_jwt
      private_key_path: "{{ env_var('ATTABOY_SF_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('ATTABOY_SF_PRIVATE_KEY_PASSPHRASE', '') }}"
      threads: 4
      client_session_keep_alive: false
      query_tag: "attaboy:dbt"
