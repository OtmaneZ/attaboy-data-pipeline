name: attaboy
version: 2.0.0
config-version: 2
profile: attaboy
require-dbt-version: [">=1.10.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

# Tout ce qui dépend du client est ici (et dans seeds/) : pour un autre
# établissement, on change ces valeurs, pas les modèles.
vars:
  local_timezone: America/Toronto   # même fuseau que Québec
  business_day_start_hour: 0        # heure où commence la journée de vente ; 4 pour un établissement ouvert après minuit
  calendar_start: "2024-01-01"
  calendar_end: "2030-12-31"
  menu_window_days: 90              # fenêtre d'analyse de la carte et des associations
  pairs_min_orders: 30              # nombre minimal de commandes communes pour afficher une paire

models:
  attaboy:
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: view
      +schema: staging
      +tags: ["intermediate"]
    marts:
      +materialized: table
      +schema: analytics
      +tags: ["marts"]
      # Contrat : noms et types des colonnes du modèle en étoile déclarés dans _core__models.yml.
      # Une colonne renommée, retirée ou d'un autre type arrête le build avant d'écrire la table.
      core:
        +contract:
          enforced: true

seeds:
  attaboy:
    +schema: staging
    menu_catalog:
      +column_types:
        product_id: varchar
        category: varchar
        estimated_unit_cost: decimal(18,2)
    tender_labels:
      +column_types:
        label_key: varchar
        tender_label: varchar
    extras_catalog:
      +column_types:
        modifier_id: varchar
        estimated_unit_cost: decimal(18,2)
