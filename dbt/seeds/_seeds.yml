version: 2

seeds:
  - name: menu_catalog
    description: >
      Catalogue du menu, tenu à la main avec le propriétaire : catégorie et coût matière
      estimé de chaque produit. C'est ici, et nulle part ailleurs, que vivent les catégories.
    columns:
      - name: product_id
        description: Identifiant du produit dans la caisse (clé).
        data_tests: [not_null, unique]
      - name: category
        description: Catégorie au sein de laquelle le produit est comparé dans l'analyse de la carte.
        data_tests: [not_null]
      - name: estimated_unit_cost
        description: Coût matière estimé d'une unité, hors extras.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: extras_catalog
    description: >
      Coût matière estimé de chaque extra payant (extra fromage, pâte sans gluten…), tenu à la main
      avec le propriétaire. Sans lui, la vente d'un article compterait ses extras et son coût non.
    columns:
      - name: modifier_id
        description: Identifiant de l'extra dans la caisse (clé).
        data_tests: [not_null, unique]
      - name: estimated_unit_cost
        description: Coût matière estimé d'un extra.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: tender_labels
    description: >
      Libellé affiché pour chaque moyen de paiement de la caisse. Clover les nomme en anglais
      et fournit une clé stable (labelKey) : c'est elle qui sert de référence.
    columns:
      - name: label_key
        description: Clé du moyen de paiement dans la caisse (ex. com.clover.tender.cash).
        data_tests: [not_null, unique]
      - name: tender_label
        description: Libellé affiché dans les rapports et le cockpit.
        data_tests: [not_null]
